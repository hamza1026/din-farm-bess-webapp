<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Din Farm BESS — Login</title><style>body{margin:0;min-height:100vh;background:#07130d;color:#eef8f1;font-family:Inter,Arial,sans-serif;display:grid;place-items:center}.box{width:min(380px,90vw);background:#10261a;border:1px solid #1e4430;border-radius:14px;padding:28px;box-shadow:0 20px 70px #0008}h1{font-size:22px;margin:0 0 6px}.sub{color:#94ad9d;font-size:12px;margin-bottom:22px}label{display:block;color:#94ad9d;font-size:11px;margin:12px 0 6px}input{width:100%;box-sizing:border-box;background:#0b1c13;color:#eef8f1;border:1px solid #1e4430;border-radius:7px;padding:10px}button{width:100%;margin-top:18px;padding:10px;border:0;border-radius:7px;background:#19b86b;color:#03110f;font-weight:700;cursor:pointer}.err{color:#ff7a8a;font-size:12px;margin-top:12px}</style></head><body><form class="box" method="post"><h1>Din Farm BESS</h1><div class="sub">BESS Operations Web Portal</div><label>Username</label><input name="username" autocomplete="username" required><label>Password</label><input type="password" name="password" autocomplete="current-password" required><button>Sign in</button>{% if msg %}<div class="err">{{msg}}</div>{% endif %}</form></body></html>
